<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表情档位预览 · 笑脸 / 中性 / 哭脸</title>
<link rel="stylesheet" href="./style.css">
<style>
  body{padding:30px 22px 60px}
  .preview{max-width:1080px;margin:0 auto}
  h1{font-size:28px;margin:0 0 6px}
  p.lead{color:#617067;margin:0 0 20px;font-size:15px;line-height:1.85}
  p.lead code{background:#eef8f0;color:#286546;padding:1px 6px;border-radius:6px;font-size:13px}
  h2{font-size:16px;color:#2c5a44;margin:26px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
  .cell{background:#fff;border:1px solid #e4eae3;border-radius:16px;padding:10px;text-align:center;box-shadow:0 8px 20px rgba(27,58,38,.05)}
  .cell canvas{width:100%;height:auto;display:block;border-radius:10px}
  .cell b{display:block;margin-top:7px;font:700 13px ui-monospace,Consolas,monospace;color:#286546}
  .cell i{display:block;font-style:normal;font-size:12px;color:#8a968d;margin-top:2px}
  table{border-collapse:collapse;margin-top:12px;font-size:13px;background:#fff;border:1px solid #e4eae3;border-radius:14px;overflow:hidden;width:100%}
  th,td{padding:9px 12px;border-bottom:1px solid #eef2ed;text-align:left}
  th{background:#f4f8f4;color:#3d7050;font-weight:700}
  td.num{font-family:ui-monospace,Consolas,monospace}
  .rules{background:#fff;border:1px solid #e4eae3;border-radius:14px;padding:14px 16px;font-size:14px;line-height:2;color:#4a6356}
  .rules b{color:#20603f}
  .rules code{background:#eef8f0;color:#286546;padding:1px 6px;border-radius:6px;font-size:13px}
</style>
<script src="./face-photo.js" defer></script>
</head>
<body>
<main class="preview">
  <h1>表情档位预览</h1>
  <p class="lead">
    显示规则（<b>硬切、瞬间切换</b>）：<b>决策分数 &gt; 0.5 → 笑脸图</b>，
    <b>−0.5 ~ 0.5 → 中性图</b>，<b>&lt; −0.5 → 哭脸图</b>。
    每张图整张替换，既不叠加也不做淡入动画，所以同一种表情在任何分数下画面完全一致。
  </p>

  <div class="rules">
    <b>score &gt; 0.5</b> → 笑脸 &nbsp;|&nbsp; <b>−0.5 ≤ score ≤ 0.5</b> → 中性 &nbsp;|&nbsp; <b>score &lt; −0.5</b> → 哭脸<br>
    切换方式：<b>瞬间替换</b>（无淡入动画）&nbsp;|&nbsp; 阈值在 <code>face-photo.js</code> 的 <code>neutralBand</code>（当前 <b id="bandShow">0.5</b>）
  </div>

  <h2>① 三态对照</h2>
  <div class="grid" id="trio"></div>

  <h2>② 连续分数</h2>
  <div class="grid" id="grid"></div>

  <h2>③ 状态判定</h2>
  <table>
    <thead><tr><th>决策分数</th><th>显示</th><th>混合量 tanh(|score|)</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</main>
<script>
window.addEventListener('load', async () => {
  const S = window.SentimentFacePhoto;
  if (!S) {
    document.querySelector('.lead').innerHTML += '<br><b style="color:#a05234">face-photo.js 未加载</b>';
    return;
  }
  const trio = document.querySelector('#trio');
  const grid = document.querySelector('#grid');
  const tbody = document.querySelector('#tbody');

  let assets = null;
  try {
    assets = {
      neutral: await S.loadImage(S.CONFIG.assets.neutral),
      smile: await S.loadImage(S.CONFIG.assets.smile),
      cry: await S.loadImage(S.CONFIG.assets.cry)
    };
  } catch (e) {
    document.querySelector('.lead').innerHTML +=
      '<br><b style="color:#a05234">素材加载失败：' + e.message + '（请用本地服务器 http:// 打开本页）</b>';
    return;
  }

  const card = (host, score, label, note) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const cv = document.createElement('canvas');
    cv.width = 220; cv.height = 220;
    const b = document.createElement('b'); b.textContent = label;
    const i = document.createElement('i'); i.textContent = note || '';
    cell.append(cv, b, i);
    host.append(cell);
    S.renderTo(cv, assets, score, 220, S.CONFIG);
  };

  card(trio, 3, 'score = +3', '笑脸');
  card(trio, 0, 'score = 0', '中性');
  card(trio, -3, 'score = −3', '哭脸');

  const band = (S.CONFIG.neutralBand == null ? 0.5 : S.CONFIG.neutralBand);
  document.querySelector('#bandShow').textContent = band;
  for (const s of [-6, -3, -0.51, -0.5, -0.2, 0, 0.2, 0.5, 0.51, 3, 6]) {
    card(grid, s, (s > 0 ? '+' : '') + s.toFixed(2),
      s > band ? '笑脸' : (s < -band ? '哭脸' : '中性'));
  }

  for (const s of [-3, -0.51, -0.5, 0, 0.5, 0.51, 3]) {
    const t = s > band ? 1 : (s < -band ? -1 : 0);
    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="num">' + s.toFixed(2) + '</td><td>' +
      (t > 0 ? '笑脸' : (t < 0 ? '哭脸' : '中性')) + '</td><td class="num">' +
      (t === 0 ? '0（纯中性图）' : '1（整张替换）') + '</td>';
    tbody.append(tr);
  }
  window.__previewReady = true;
});
</script>
</body>
</html>
